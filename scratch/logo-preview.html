<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Crediqly Premium Logo Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 p-12 space-y-12">
  <div class="max-w-4xl mx-auto space-y-10">
    <div>
      <h1 class="text-3xl font-black text-slate-900">Crediqly Premium Logo Variants</h1>
      <p class="text-slate-500 text-sm mt-1">Inspection across light, dark, sidebar, and navbar contexts.</p>
    </div>

    <!-- Light Background (Navbar & Dashboard Sidebar) -->
    <div class="p-8 bg-white rounded-3xl border border-slate-200 shadow-sm space-y-6">
      <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">On Light Background (Navbar, Dashboard, Landing)</h3>
      <div class="flex items-center gap-10 flex-wrap">
        <!-- Variant 1: Full Brand with Subtitle -->
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 shrink-0">
            <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full drop-shadow-sm">
              <defs>
                <linearGradient id="cq-bg1" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#1E40AF" />
                  <stop offset="50%" stop-color="#1D4ED8" />
                  <stop offset="100%" stop-color="#0F172A" />
                </linearGradient>
                <linearGradient id="cq-arc1" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#93C5FD" />
                  <stop offset="50%" stop-color="#3B82F6" />
                  <stop offset="100%" stop-color="#2563EB" />
                </linearGradient>
                <linearGradient id="cq-accent1" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#34D399" />
                  <stop offset="100%" stop-color="#06B6D4" />
                </linearGradient>
              </defs>
              <rect width="40" height="40" rx="11" fill="url(#cq-bg1)" />
              <rect x="0.5" y="0.5" width="39" height="39" rx="10.5" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1" />
              <!-- C curve -->
              <path d="M 27 13.5 C 24.6 11.2 21.4 10 17.5 10 C 12.2 10 8 14.5 8 20 C 8 25.5 12.2 30 17.5 30 C 22 30 25.4 28 27.2 25.5" stroke="url(#cq-arc1)" stroke-width="3.8" stroke-linecap="round" />
              <!-- Upward growth arrow -->
              <path d="M 20.5 14.5 L 28.5 14.5 L 28.5 22.5 M 28.5 14.5 L 18 25" stroke="url(#cq-accent1)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />
              <circle cx="28.5" cy="14.5" r="1.5" fill="#34D399" />
            </svg>
          </div>
          <div class="flex flex-col">
            <div class="flex items-center tracking-tight font-black text-2xl text-slate-900 leading-none">
              <span>Crediq</span><span class="text-brand-600">ly</span>
            </div>
            <span class="text-[10px] font-extrabold tracking-widest uppercase text-brand-600 mt-1">
              Business Credit & Funding
            </span>
          </div>
        </div>

        <!-- Variant 2: Command Center Badge -->
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 shrink-0">
            <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full drop-shadow-sm">
              <rect width="40" height="40" rx="10" fill="url(#cq-bg1)" />
              <rect x="0.5" y="0.5" width="39" height="39" rx="9.5" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1" />
              <path d="M 27 13.5 C 24.6 11.2 21.4 10 17.5 10 C 12.2 10 8 14.5 8 20 C 8 25.5 12.2 30 17.5 30 C 22 30 25.4 28 27.2 25.5" stroke="url(#cq-arc1)" stroke-width="3.8" stroke-linecap="round" />
              <path d="M 20.5 14.5 L 28.5 14.5 L 28.5 22.5 M 28.5 14.5 L 18 25" stroke="url(#cq-accent1)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />
              <circle cx="28.5" cy="14.5" r="1.5" fill="#34D399" />
            </svg>
          </div>
          <div class="flex flex-col">
            <span class="text-xl font-black tracking-tight text-slate-900 leading-none">Crediqly</span>
            <span class="text-[10px] font-bold tracking-wider uppercase text-brand-700 mt-0.5">Command Center</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Dark Background (Footer, Admin Console) -->
    <div class="p-8 bg-slate-950 rounded-3xl border border-slate-800 shadow-xl space-y-6 text-white">
      <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500">On Dark Background (Admin Console, Footer)</h3>
      <div class="flex items-center gap-10 flex-wrap">
        <!-- Variant: Admin Console -->
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 shrink-0">
            <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full drop-shadow-md">
              <rect width="40" height="40" rx="11" fill="url(#cq-bg1)" />
              <rect x="0.5" y="0.5" width="39" height="39" rx="10.5" stroke="rgba(255, 255, 255, 0.28)" stroke-width="1" />
              <path d="M 27 13.5 C 24.6 11.2 21.4 10 17.5 10 C 12.2 10 8 14.5 8 20 C 8 25.5 12.2 30 17.5 30 C 22 30 25.4 28 27.2 25.5" stroke="url(#cq-arc1)" stroke-width="3.8" stroke-linecap="round" />
              <path d="M 20.5 14.5 L 28.5 14.5 L 28.5 22.5 M 28.5 14.5 L 18 25" stroke="url(#cq-accent1)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />
              <circle cx="28.5" cy="14.5" r="1.5" fill="#34D399" />
            </svg>
          </div>
          <div class="flex flex-col">
            <div class="flex items-center tracking-tight font-black text-2xl text-white leading-none">
              <span>Crediq</span><span class="text-brand-400">ly</span>
            </div>
            <span class="text-[10px] font-bold tracking-wider uppercase text-brand-400 mt-1 flex items-center gap-1">
              Admin Console
            </span>
          </div>
        </div>

        <!-- Variant: Clean Footer -->
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 shrink-0">
            <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
              <rect width="40" height="40" rx="10" fill="url(#cq-bg1)" />
              <rect x="0.5" y="0.5" width="39" height="39" rx="9.5" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />
              <path d="M 27 13.5 C 24.6 11.2 21.4 10 17.5 10 C 12.2 10 8 14.5 8 20 C 8 25.5 12.2 30 17.5 30 C 22 30 25.4 28 27.2 25.5" stroke="url(#cq-arc1)" stroke-width="3.8" stroke-linecap="round" />
              <path d="M 20.5 14.5 L 28.5 14.5 L 28.5 22.5 M 28.5 14.5 L 18 25" stroke="url(#cq-accent1)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />
              <circle cx="28.5" cy="14.5" r="1.5" fill="#34D399" />
            </svg>
          </div>
          <span class="text-xl font-black text-white tracking-tight">Crediqly</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
