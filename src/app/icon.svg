  <path d="M 26 27.5 C 23.5 30.5 19.8 31.8 15.5 30.5 C 10.5 29 7.5 24.2 7.5 19 C 7.5 13.8 10.5 9 15.5 7.5 C 19.8 6.2 23.5 7.5 26 10.5" 
